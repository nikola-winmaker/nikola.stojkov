<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>HALO Workshop Primer</title>
		<style>
			:root {
				color-scheme: light;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				font-family: "IBM Plex Sans", sans-serif;
				background:
					radial-gradient(circle at top left, rgba(14, 165, 164, 0.16), transparent 28%),
					radial-gradient(circle at top right, rgba(37, 99, 235, 0.14), transparent 32%),
					linear-gradient(180deg, #eff6ff 0%, #f8fafc 48%, #edf2f7 100%);
				color: #0f172a;
			}

			body {
				display: grid;
				place-items: center;
				padding: 24px;
				box-sizing: border-box;
			}

			.main {
				width: min(760px, 100%);
				background: rgba(255, 255, 255, 0.84);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(15, 23, 42, 0.12);
				border-radius: 28px;
				box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
				padding: 28px;
				box-sizing: border-box;
			}

			.badge {
				display: inline-block;
				padding: 8px 12px;
				border-radius: 999px;
				background: rgba(15, 118, 110, 0.1);
				border: 1px solid rgba(15, 118, 110, 0.16);
				color: #0f766e;
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}

			h1 {
				font-family: "Space Grotesk", sans-serif;
				font-size: clamp(2rem, 4vw, 3.3rem);
				margin: 16px 0 8px;
				letter-spacing: -0.04em;
			}

			p {
				margin: 0 0 16px;
				line-height: 1.55;
				color: #475569;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin-top: 20px;
			}

			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 12px 18px;
				border-radius: 999px;
				text-decoration: none;
				font-weight: 700;
				transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
			}

			a:hover {
				transform: translateY(-1px);
			}

			.primary {
				background: #0f172a;
				color: #fff;
				box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
			}

			.secondary {
				background: rgba(255, 255, 255, 0.8);
				color: #0f172a;
				border: 1px solid rgba(15, 23, 42, 0.12);
			}

			.meta {
				margin-top: 18px;
				font-size: 0.95rem;
				color: #64748b;
			}
		</style>
	</head>
	<body>
		<main class="main">
			<div class="badge">HALO Workshop Primer</div>
			<h1>Choose the right view</h1>
			<p>This page routes to the desktop deck on larger screens and to the merged mobile deck on smaller screens.</p>
			<div class="actions">
				<a class="primary" id="desktopLink" href="/halo-reading-materials.html">Open desktop view</a>
				<a class="secondary" id="mobileLink" href="/halo-reading-materials-mobile.html">Open mobile view</a>
			</div>
			<p class="meta" id="status">Detecting the best view for your device.</p>
		</main>
		<script>
			const desktopUrl = "/halo-reading-materials.html";
			const mobileUrl = "/halo-reading-materials-mobile.html";
			const viewportWidth = Math.min(window.innerWidth || Infinity, window.visualViewport?.width || Infinity, window.screen?.width || Infinity);
			const viewportHeight = Math.min(window.innerHeight || Infinity, window.visualViewport?.height || Infinity, window.screen?.height || Infinity);
			const longestSide = Math.max(viewportWidth, viewportHeight);
			const shortestSide = Math.min(viewportWidth, viewportHeight);
			const aspectRatio = shortestSide / longestSide;
			const isDesktop = longestSide >= 900 || (longestSide >= 650 && aspectRatio >= 0.72);
			const isMobile = !isDesktop;
			document.getElementById("desktopLink").href = desktopUrl;
			document.getElementById("mobileLink").href = mobileUrl;
			document.getElementById("status").textContent = isMobile
				? `Mobile view selected automatically for ${Math.round(viewportWidth)}x${Math.round(viewportHeight)}.`
				: `Desktop view selected automatically for ${Math.round(viewportWidth)}x${Math.round(viewportHeight)}.`;
			window.location.replace(isMobile ? mobileUrl : desktopUrl);
		</script>
	</body>
</html>
